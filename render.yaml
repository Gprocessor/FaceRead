services:
  - type: web
    name: faceattend-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Render's 512 MB free tier cannot hold an InsightFace model.
      # Local development uses insightface/buffalo_l via backend/.env.
      - key: FACE_ENGINE
        value: fallback
      - key: ALLOWED_ORIGINS
        value: https://gprocessor.github.io
      - key: FACE_MATCH_THRESHOLD
        value: 0.5
