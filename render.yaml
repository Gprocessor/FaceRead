services:
  - type: web
    name: faceattend-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FACE_ENGINE
        value: insightface
      - key: INSIGHTFACE_MODEL
        value: buffalo_l
      - key: ALLOWED_ORIGINS
        value: https://gprocessor.github.io
      - key: FACE_MATCH_THRESHOLD
        value: 0.68
